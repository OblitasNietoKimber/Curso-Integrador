spring.config.import=optional:file:.env[.properties]
spring.application.name=Backend

# Configuracion de conexion a PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lenas_sabores}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Puerto del servidor
server.port=${PORT:8080}

# Migraciones de autenticación; las tablas existentes del catálogo se conservan.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
server.servlet.session.cookie.name=LYSSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=30m
app.auth.cookie-secure=${SESSION_COOKIE_SECURE:false}
app.auth.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.auth.reset-enabled=${PASSWORD_RESET_ENABLED:false}
app.auth.mail-from=${MAIL_FROM:no-reply@localhost}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}

# Google OAuth: las credenciales se usan únicamente en el servidor.
app.auth.google-enabled=${GOOGLE_LOGIN_ENABLED:false}
app.auth.google-client-id=${GOOGLE_CLIENT_ID:}
app.auth.google-client-secret=${GOOGLE_CLIENT_SECRET:}
app.auth.google-redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:5173/login/oauth2/code/google}

# Clave AES-256 en Base64; conservarla mientras existan cuentas con 2FA.
app.auth.totp-key=${TOTP_ENCRYPTION_KEY:}

# Imágenes subidas desde el administrador. Mantener este directorio entre despliegues.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.imagenes.directorio=${IMAGENES_DIRECTORIO:uploads/catalogo}
