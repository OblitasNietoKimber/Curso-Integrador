# Standalone container configuration. Does not import any local .env file.
spring.application.name=Backend
server.address=0.0.0.0
server.port=${PORT:10000}
server.forward-headers-strategy=framework

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.imagenes.directorio=${IMAGENES_DIRECTORIO:/app/uploads/catalogo}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

server.servlet.session.cookie.name=LYSSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true
server.servlet.session.timeout=30m
app.auth.cookie-secure=true
app.auth.frontend-url=${FRONTEND_URL}
app.cors.allowed-origins=${ALLOWED_ORIGINS:${FRONTEND_URL}}
app.auth.totp-key=${TOTP_ENCRYPTION_KEY:}

app.auth.reset-enabled=${PASSWORD_RESET_ENABLED:false}
app.auth.mail-from=${MAIL_FROM:no-reply@localhost}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.auth.google-enabled=${GOOGLE_LOGIN_ENABLED:false}
app.auth.google-client-id=${GOOGLE_CLIENT_ID:}
app.auth.google-client-secret=${GOOGLE_CLIENT_SECRET:}
app.auth.google-redirect-uri=${GOOGLE_REDIRECT_URI:${FRONTEND_URL}/login/oauth2/code/google}
